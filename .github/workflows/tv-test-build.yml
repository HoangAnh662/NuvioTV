name: Build Nuvio TV Test

on:
  push:
    branches:
      - fix/catalog-manifest-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch full instant catalog refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home_utils = Path("app/src/main/java/com/nuvio/tv/ui/screens/home/HomeViewModelCatalogUtils.kt")
          h = home_utils.read_text()
          old = "        .sorted()\n        .joinToString(separator = \",\")"
          new = "        .joinToString(separator = \",\")"
          if old in h:
              home_utils.write_text(h.replace(old, new, 1))

          home_vm = Path("app/src/main/java/com/nuvio/tv/ui/screens/home/HomeViewModel.kt")
          v = home_vm.read_text()
          state_marker = "    val uiState: StateFlow<HomeUiState> by lazy { createShuffleHomeState() }\n"
          if "private var homeManifestRefreshJob: Job? = null" not in v:
              if state_marker not in v:
                  raise SystemExit("Home refresh state marker not found")
              v = v.replace(
                  state_marker,
                  state_marker + "\n    private var homeManifestRefreshJob: Job? = null\n",
                  1,
              )
          old_visit = "    fun beginShuffleHomeVisit() {\n        shuffleHomeRefresh.update { it.copy(visit = it.visit + 1) }\n    }"
          new_visit = "    fun beginShuffleHomeVisit() {\n        shuffleHomeRefresh.update { it.copy(visit = it.visit + 1) }\n        // One refresh per Home activation, with no timer/polling. Ignore overlapping visits\n        // while a sweep is already running. fetchAddon preserves same-version change detection.\n        if (homeManifestRefreshJob?.isActive != true) {\n            homeManifestRefreshJob = viewModelScope.launch {\n                val addons = addonRepository.getInstalledAddons().first()\n                addons\n                    .asSequence()\n                    .filter { it.enabled }\n                    .map { it.baseUrl }\n                    .filter { it.isNotBlank() }\n                    .distinct()\n                    .forEach { baseUrl -> addonRepository.fetchAddon(baseUrl) }\n            }\n        }\n    }"
          if old_visit not in v:
              raise SystemExit("Home visit marker not found")
          home_vm.write_text(v.replace(old_visit, new_visit, 1))

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text()
          old_id = 'applicationId = "com.nuvio.tv"'
          if old_id not in g:
              raise SystemExit("applicationId marker not found")
          gradle.write_text(g.replace(old_id, 'applicationId = "com.nuvio.tv.test"', 1))

          strings = Path("app/src/main/res/values/strings.xml")
          x = strings.read_text()
          old_name = '<string name="app_name">Nuvio</string>'
          if old_name not in x:
              raise SystemExit("app name marker not found")
          strings.write_text(x.replace(old_name, '<string name="app_name">Nuvio TV Test</string>', 1))
          PY

      - name: Build ARM APKs
        env:
          CI_USE_DEBUG_SIGNING: 'true'
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Prepare ARMv7 APK
        shell: bash
        run: |
          mkdir -p out
          f=$(find app/build/outputs/apk/full/release -type f \( -name '*armeabi-v7a*.apk' -o -name '*armv7*.apk' \) | head -n 1)
          test -n "$f"
          cp "$f" out/Nuvio-TV-Test-1.1.0-beta3-armv7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Test-armv7
          path: out/Nuvio-TV-Test-1.1.0-beta3-armv7.apk
          if-no-files-found: error
