name: Build Nuvio TV Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make side-by-side test package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = 'applicationId = "com.nuvio.tv"'
          new = 'applicationId = "com.nuvio.tv.test"'
          if old not in s:
              raise SystemExit('Original full applicationId not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('<string name="app_name">Nuvio</string>', '<string name="app_name">Nuvio TV Test</string>', 1)
          p.write_text(s)
          PY

      - name: Configure signing and app properties
        shell: bash
        run: |
          missing=0
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing GitHub Secret for $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          keystore_path="${RUNNER_TEMP}/nuvio-tv-test-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "$keystore_path"

          if [ -n "${LOCAL_PROPERTIES_BASE64}" ]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
            echo 'LOCAL_PROPERTIES_BASE64 is not set; account/service credentials not supplied.'
          fi

          set_property() {
            local name="$1"
            local value="$2"
            sed -i -E "/^[[:space:]]*${name}[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "$name" "$value" >> local.properties
          }

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          set_property NUVIO_RELEASE_STORE_FILE "$keystore_path"
          set_property NUVIO_RELEASE_KEY_ALIAS "$RELEASE_KEY_ALIAS"
          set_property NUVIO_RELEASE_KEY_PASSWORD "$RELEASE_KEY_PASSWORD"
          set_property NUVIO_RELEASE_STORE_PASSWORD "$RELEASE_STORE_PASSWORD"

      - name: Build full ARM APKs with release signing
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Keep ARM64 APK
        shell: bash
        run: |
          mkdir -p out
          f=$(find app/build/outputs/apk/full/release -type f -name '*arm64-v8a*.apk' | head -n1)
          if [ -z "$f" ]; then
            echo 'ARM64 APK not found'
            find app/build/outputs/apk/full/release -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$f" out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Test-arm64
          path: out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk
          if-no-files-found: error
