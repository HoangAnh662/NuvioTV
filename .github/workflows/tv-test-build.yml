name: Build Nuvio TV Test

on:
  push:
    branches:
      - fix/catalog-manifest-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch full instant catalog refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home_utils = Path("app/src/main/java/com/nuvio/tv/ui/screens/home/HomeViewModelCatalogUtils.kt")
          h = home_utils.read_text()
          old = "        .sorted()\n        .joinToString(separator = \",\")"
          new = "        .joinToString(separator = \",\")"
          if old in h:
              home_utils.write_text(h.replace(old, new, 1))

          home_vm = Path("app/src/main/java/com/nuvio/tv/ui/screens/home/HomeViewModel.kt")
          v = home_vm.read_text()
          old_visit = "    fun beginShuffleHomeVisit() {\n        shuffleHomeRefresh.update { it.copy(visit = it.visit + 1) }\n    }"
          new_visit = "    fun beginShuffleHomeVisit() {\n        shuffleHomeRefresh.update { it.copy(visit = it.visit + 1) }\n        viewModelScope.launch {\n            val addons = addonRepository.getInstalledAddons().first()\n            addons\n                .asSequence()\n                .filter { it.enabled }\n                .map { it.baseUrl }\n                .filter { it.isNotBlank() }\n                .distinct()\n                .toList()\n                .forEach { baseUrl -> addonRepository.fetchAddon(baseUrl) }\n        }\n    }"
          if old_visit in v:
              home_vm.write_text(v.replace(old_visit, new_visit, 1))

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text()
          old_id = 'applicationId = "com.nuvio.tv"'
          if old_id not in g:
              raise SystemExit("applicationId marker not found")
          gradle.write_text(g.replace(old_id, 'applicationId = "com.nuvio.tv.test"', 1))

          strings = Path("app/src/main/res/values/strings.xml")
          x = strings.read_text()
          old_name = '<string name="app_name">Nuvio</string>'
          if old_name not in x:
              raise SystemExit("app name marker not found")
          strings.write_text(x.replace(old_name, '<string name="app_name">Nuvio TV Test</string>', 1))
          PY

      - name: Build ARM APKs
        env:
          CI_USE_DEBUG_SIGNING: 'true'
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Prepare ARM64 APK
        shell: bash
        run: |
          mkdir -p out
          f=$(find app/build/outputs/apk/full/release -type f -name '*arm64-v8a*.apk' | head -n 1)
          test -n "$f"
          cp "$f" out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Test-arm64
          path: out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk
          if-no-files-found: error
