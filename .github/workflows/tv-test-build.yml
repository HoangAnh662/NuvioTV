name: Build Nuvio TV Test

on:
  push:
    branches:
      - fix/catalog-manifest-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch test build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path("app/src/main/java/com/nuvio/tv/data/repository/AddonRepositoryImpl.kt")
          s = repo.read_text()
          s = s.replace(
              "private const val MANIFEST_CACHE_TTL_MS = 6 * 60 * 60 * 1000L",
              "private const val MANIFEST_CACHE_TTL_MS = 15 * 60 * 1000L",
              1,
          )
          repo.write_text(s)

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace(
              'applicationId = "com.nuvio.tv"',
              'applicationId = "com.nuvio.tv.test"',
              1,
          )
          gradle.write_text(g)

          strings = Path("app/src/main/res/values/strings.xml")
          x = strings.read_text()
          x = x.replace(
              '<string name="app_name">Nuvio</string>',
              '<string name="app_name">Nuvio TV Test</string>',
              1,
          )
          strings.write_text(x)
          PY

      - name: Build ARM APKs
        env:
          CI_USE_DEBUG_SIGNING: 'true'
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Prepare ARM64 APK
        shell: bash
        run: |
          mkdir -p out
          f=$(find app/build/outputs/apk/full/release -type f -name '*arm64-v8a*.apk' | head -n 1)
          test -n "$f"
          cp "$f" out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Test-arm64
          path: out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk
          if-no-files-found: error
