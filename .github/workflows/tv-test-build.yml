name: Build Nuvio TV Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply catalog refresh test fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('app/src/main/java/com/nuvio/tv/data/repository/AddonRepositoryImpl.kt')
          s = repo.read_text()
          old_ttl = 'private const val MANIFEST_CACHE_TTL_MS = 6 * 60 * 60 * 1000L'
          new_ttl = 'private const val MANIFEST_CACHE_TTL_MS = 15 * 60 * 1000L'
          if old_ttl not in s:
              raise SystemExit('Manifest TTL marker not found')
          s = s.replace(old_ttl, new_ttl, 1)

          old_init = '''    init {
        syncScope.launch { loadManifestCacheFromDisk() }
    }
'''
          new_init = '''    init {
        syncScope.launch { loadManifestCacheFromDisk() }
        // Keep manifests fresh while Android TV leaves Nuvio alive for long periods.
        syncScope.launch {
            while (true) {
                delay(MANIFEST_CACHE_TTL_MS)
                val urls = preferences.installedAddonUrls.first()
                val enabledStates = preferences.addonEnabledStates.first()
                scheduleManifestRefresh(
                    urls.filter { url -> enabledStates[canonicalizeUrl(url)] ?: true }
                )
            }
        }
    }
'''
          if old_init not in s:
              raise SystemExit('Repository init marker not found')
          repo.write_text(s.replace(old_init, new_init, 1))

          home = Path('app/src/main/java/com/nuvio/tv/ui/screens/home/HomeViewModelCatalogUtils.kt')
          h = home.read_text()
          old_sort = '''        }
        .sorted()
        .joinToString(separator = ",")
'''
          new_sort = '''        }
        .joinToString(separator = ",")
'''
          if old_sort not in h:
              raise SystemExit('Home catalog signature sort marker not found')
          home.write_text(h.replace(old_sort, new_sort, 1))
          PY

      - name: Make side-by-side test package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = 'applicationId = "com.nuvio.tv"'
          new = 'applicationId = "com.nuvio.tv.test"'
          if old not in s:
              raise SystemExit('Original full applicationId not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('<string name="app_name">Nuvio</string>', '<string name="app_name">Nuvio TV Test</string>', 1)
          p.write_text(s)
          PY

      - name: Build full ARM APKs with test signing
        env:
          CI_USE_DEBUG_SIGNING: 'true'
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Keep ARM64 APK
        shell: bash
        run: |
          mkdir -p out
          f=$(find app/build/outputs/apk/full/release -type f -name '*arm64-v8a*.apk' | head -n1)
          if [ -z "$f" ]; then
            echo 'ARM64 APK not found'
            find app/build/outputs/apk/full/release -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$f" out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Test-arm64
          path: out/Nuvio-TV-Test-1.1.0-beta3-arm64.apk
          if-no-files-found: error
